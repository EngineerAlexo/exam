<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password – Online Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
<main class="login-card">
  <div class="brand-mark">🔐</div>
  <h1>Set your new password</h1>
  <p class="muted" id="hello">Loading…</p>
  <form id="pwForm" class="stack">
    <label>New password (min. 8 characters)
      <input id="newPass" type="password" required minlength="8" autocomplete="new-password" placeholder="Enter new password">
    </label>
    <label>Confirm new password
      <input id="confirmPass" type="password" required minlength="8" autocomplete="new-password" placeholder="Confirm new password">
    </label>
    <button class="btn btn-block" type="submit">Save and continue</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
